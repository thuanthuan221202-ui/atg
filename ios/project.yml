name: AntigravityRemote
options:
  bundleIdPrefix: com.antigravity.remote
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "3"

targets:
  AntigravityRemote:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AntigravityRemote
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: AntigravityRemote
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.remote.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AntigravityRemote/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""

schemes:
  AntigravityRemote:
    build:
      targets:
        AntigravityRemote: all
    archive:
      config: Release
